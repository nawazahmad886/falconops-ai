version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# FalconOps AI — On-premise docker-compose
#
# On RHEL/CentOS/Rocky/Alma 7 or 8, run ./install-rhel.sh first — it installs
# Docker, generates backend/.env (random JWT secret, CORS_ORIGINS for your
# domain), hardens the firewall, and runs the two commands below for you.
#
# Manual quick start (from the unpacked bundle root, once backend/.env exists):
#   docker compose build                                # builds frontend + backend
#   docker compose up -d                                # starts everything
#   open http://localhost                               # nginx serves on :80
#
# Re-build frontend after changing REACT_APP_BACKEND_URL (it's baked at build):
#   docker compose build frontend && docker compose up -d
#
# Note: mongo/redis/backend/frontend ports are published to 127.0.0.1 only —
# nginx (80/443) is the sole externally-reachable service.
#
# victoria-metrics (real TSDB for metrics) and kafka (real event broker, KRaft mode —
# no Zookeeper) are both optional-but-recommended sidecars: the backend degrades
# gracefully to its existing MongoDB-backed paths if either is unreachable, so you can
# stand the stack up without them and add them later without a backend code change.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ======================== FRONTEND ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # REACT_APP_BACKEND_URL is BAKED into the JS at build time. Override here
      # when you want a different URL than the bundled .env.
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost}
    # Loopback-only — nginx is the only thing that should be reachable from
    # the network. Still curl-able from the host itself for debugging.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - falconops-net
    restart: unless-stopped

  # ======================== BACKEND ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # NET_RAW: needed for real ICMP traceroute (network path analyzer) — raw sockets
    # to send/receive ICMP echo + time-exceeded packets. Without it the traceroute
    # endpoint degrades gracefully to DNS/TCP/TLS timing only (see network_path_service.py).
    cap_add:
      - NET_RAW
    # Loopback-only — reached externally only via the nginx reverse proxy.
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # ── These OVERRIDE backend/.env so the container always talks to the
      #    sidecar mongo + redis + victoria-metrics + kafka regardless of what's in
      #    the file. ──
      # MONGO_ROOT_PASSWORD / REDIS_PASSWORD come from the repo-root .env (see
      # .env.example) — generated by install.sh/install-rhel.sh, not backend/.env.
      - MONGO_URL=mongodb://root:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in the repo-root .env}@mongo:27017/?authSource=admin
      - DB_NAME=${DB_NAME:-falconops}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in the repo-root .env}@redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - VICTORIA_METRICS_URL=http://victoria-metrics:8428
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      victoria-metrics:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - falconops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - falconops-reports:/tmp/falconops_reports

  # ======================== MONGODB ========================
  mongo:
    image: mongo:8
    # Loopback-only AND credentialed — defense in depth: network isolation alone
    # was the only protection before, now a leaked/misrouted port still requires
    # real credentials (MONGO_ROOT_PASSWORD, generated by install.sh/install-rhel.sh
    # into the repo-root .env).
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in the repo-root .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - falconops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "root", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ======================== REDIS ========================
  redis:
    image: redis:7-alpine
    # Loopback-only AND credentialed — same reasoning as mongo above.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - falconops-net
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in the repo-root .env}

  # ======================== VICTORIAMETRICS (metrics TSDB) ========================
  victoria-metrics:
    image: victoriametrics/victoria-metrics:stable
    # Loopback-only — reached only by the backend, same reasoning as mongo/redis.
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=3"   # months
    networks:
      - falconops-net
    restart: unless-stopped

  # ======================== KAFKA (KRaft mode, no Zookeeper) ========================
  kafka:
    image: apache/kafka:3.8.0
    # Loopback-only — reached only by the backend, same reasoning as mongo/redis.
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Fixed example cluster ID from Apache Kafka's own KRaft docs — fine for a
      # single-node deployment. Regenerate via `kafka-storage.sh random-uuid` if you
      # ever move to a multi-broker cluster.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - falconops-net
    restart: unless-stopped

  # ======================== NGINX GATEWAY ========================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - falconops-net
    restart: unless-stopped

  # ======================== CERTBOT (Let's Encrypt) ========================
  # Idle by default — real cert issuance/renewal is triggered on-demand by
  # ./setup-https.sh (webroot method, validated via nginx's /.well-known/acme-challenge/
  # location). Requires a real domain (not a bare IP) pointed at this host on port 80.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["sh", "-c", "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"]
    networks:
      - falconops-net
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  victoria-metrics-data:
  kafka-data:
  falconops-reports:
  certbot-webroot:
  certbot-certs:

networks:
  falconops-net:
    driver: bridge
